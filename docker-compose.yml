# Copy .env.example to .env, then: docker compose up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_SERVICE_DB_USER: ${USER_SERVICE_DB_USER}
      USER_SERVICE_DB_PASSWORD: ${USER_SERVICE_DB_PASSWORD}
      SCRAPER_SERVICE_DB_USER: ${SCRAPER_SERVICE_DB_USER}
      SCRAPER_SERVICE_DB_PASSWORD: ${SCRAPER_SERVICE_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - backend

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
    ports:
      # 7474 is the browser console, handy for showing the graph by hand.
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Substituted by compose, not by the shell in the container: the neo4j
      # image turns NEO4J_* variables into config settings, so the credentials
      # must not be passed in as environment.
      test:
        - "CMD-SHELL"
        - "cypher-shell -u '${NEO4J_USER:-neo4j}' -p '${NEO4J_PASSWORD}' 'return 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend

  user_service:
    build: ./backend/user_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${USER_SERVICE_DB_USER}:${USER_SERVICE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: http://localhost:${USER_SERVICE_PORT:-8002}/auth/google/callback
      # Where the browser lands after Google says yes. The frontend reads the
      # token pair out of the fragment and clears it from the address bar.
      LOGIN_SUCCESS_REDIRECT: ${LOGIN_SUCCESS_REDIRECT:-http://localhost:5173/}
      UVICORN_ARGS: "--reload"
    ports:
      - "${USER_SERVICE_PORT:-8002}:8002"
    volumes:
      - ./backend/user_service/app:/service/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  scraper_service:
    build: ./backend/scraper_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${SCRAPER_SERVICE_DB_USER}:${SCRAPER_SERVICE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      USER_SERVICE_URL: http://user_service:8002
      REQUEST_MIN_INTERVAL_SECONDS: ${SCRAPER_MIN_INTERVAL_SECONDS:-1.0}
      BROWSER_MAX_PAGES: ${SCRAPER_BROWSER_MAX_PAGES:-2}
      CAPTURE_RENDERED_HTML: ${SCRAPER_CAPTURE_RENDERED_HTML:-true}
      LOG_LEVEL: ${SCRAPER_LOG_LEVEL:-INFO}
      UVICORN_ARGS: "--reload"
    ports:
      - "${SCRAPER_SERVICE_PORT:-8003}:8003"
    volumes:
      - ./backend/scraper_service/app:/service/app
    # Chromium needs more than the 64MB of shared memory a container gets.
    shm_size: "1gb"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      user_service:
        condition: service_started
    networks:
      - backend

  app_service:
    build: ./backend/app_service
    restart: unless-stopped
    environment:
      USER_SERVICE_URL: http://user_service:8002
      SCRAPER_SERVICE_URL: http://scraper_service:8003
      UVICORN_ARGS: "--reload"
    ports:
      - "${APP_SERVICE_PORT:-8001}:8001"
    volumes:
      - ./backend/app_service/app:/service/app
    depends_on:
      user_service:
        condition: service_started
      scraper_service:
        condition: service_started
    networks:
      - backend

  gateway:
    build: ./backend/gateway
    restart: unless-stopped
    environment:
      APP_SERVICE_URL: http://app_service:8001
      USER_SERVICE_URL: http://user_service:8002
      UVICORN_ARGS: "--reload"
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./backend/gateway/app:/service/app
    depends_on:
      app_service:
        condition: service_started
      user_service:
        condition: service_started
    networks:
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    # nginx serves the built bundle and proxies /api to the gateway, so the
    # browser only ever sees one origin.
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  neo4j_data:

networks:
  backend:
    driver: bridge
