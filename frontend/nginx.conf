server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is fingerprinted, so it can be cached hard. index.html is not,
    # and must not be, or a deploy never reaches anybody.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything the backend owns. The rewrite drops the /api prefix, which is
    # what the vite dev server does too, so the browser sees one origin and
    # there is no CORS to configure anywhere.
    location /api/ {
        # Resolved at request time, not at startup. With a literal hostname
        # nginx refuses to boot while the gateway is still coming up, and then
        # caches its first IP for good, which breaks on the next redeploy.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream gateway;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A sweep can hold the connection open for a while.
        proxy_read_timeout 300s;
        # The Google redirect has to reach the browser, not be followed here.
        proxy_redirect off;
    }

    # The router lives in the client, so an unknown path is a route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
