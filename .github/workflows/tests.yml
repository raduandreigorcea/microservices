name: tests

# Every push, plus every pull request, so a branch is green before it merges.
on:
  push:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # gateway and app_service talk to nothing and ignore all three; the other
    # two point their fixtures at them.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: microservices
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d microservices"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test_password 'return 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
          --health-start-period 30s

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci_postgres_pw@localhost:5432/microservices
      # Read by scraper_service only. Without it the neo4j tests skip.
      TEST_NEO4J_URL: bolt://localhost:7687
      TEST_NEO4J_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same interpreter the service Dockerfiles build on.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/*/requirements.txt

      - name: Install dependencies
        # One interpreter for all four suites. The shared pins agree across the
        # services, so pip would refuse this step if they ever drifted apart.
        run: |
          pip install \
            -r backend/gateway/requirements.txt \
            -r backend/app_service/requirements.txt \
            -r backend/user_service/requirements.txt \
            -r backend/scraper_service/requirements.txt

      - name: gateway
        working-directory: backend/gateway
        run: pytest -q

      - name: app_service
        working-directory: backend/app_service
        run: pytest -q

      - name: user_service
        working-directory: backend/user_service
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest -q

      - name: scraper_service
        working-directory: backend/scraper_service
        env:
          TEST_REDIS_URL: redis://localhost:6379/14
        run: pytest -q
