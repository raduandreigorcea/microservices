<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Runtime architecture: browser to nginx to gateway to app_service, which dispatches to user_service and scraper_service; both check bearer tokens with user_service and own separate postgres schemas, redis databases and, for the scraper, a neo4j graph.">
  <title>Runtime architecture: browser to nginx to gateway to app_service, which dispatches to user_service and scraper_service; both check bearer tokens with user_service and own separate postgres schemas, redis databases and, for the scraper, a neo4j graph.</title>
